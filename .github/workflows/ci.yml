name: quality-gates
on: [push, pull_request]
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m compileall -q contracts policy
      - run: genvm-lint lint contracts/WitlockRegistry.py --json
      - run: genvm-lint lint contracts/WitlockAgreement.py --json
      - run: python scripts/genvm_lint.py check contracts/WitlockRegistry.py --json
      - run: python scripts/genvm_lint.py check contracts/WitlockAgreement.py --json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run cli:version
      - run: npm run preflight
      - run: npm run web:build
