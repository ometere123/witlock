name: quality-gates
on: [push, pull_request]
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Cache pinned Direct Mode runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-v0.2.16-${{ runner.os }}
      - name: Warm pinned Direct Mode runtime
        shell: bash
        run: |
          cache_dir="$HOME/.cache/gltest-direct"
          tarball="$cache_dir/genvm-universal-v0.2.16.tar.xz"
          mkdir -p "$cache_dir"
          if [ ! -s "$tarball" ]; then
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
              "https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz" \
              --output "$tarball"
          fi
      - run: python -m pytest -q tests
      - run: python -m compileall -q contracts policy
      - run: python scripts/genvm_lint.py lint contracts/Witlock.py --json
      - run: python scripts/genvm_lint.py check contracts/Witlock.py --json
      - run: python scripts/genvm_lint.py schema contracts/Witlock.py --json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run cli:version
      - run: npm run preflight
      - run: npm run web:test
      - run: npm run web:build
